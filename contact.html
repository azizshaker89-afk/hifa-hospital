<body data-page="contact">
<header id="site-header"></header>

<main>
  <section class="page-head simple">
    <div class="container">
      <h1 data-i18n="ct.title"></h1>
      <p data-i18n="ct.sub"></p>
    </div>
  </section>

  <section class="section">
    <div class="container contact-grid">
      <aside>
        <h2 class="block-title" style="margin-bottom:22px" data-i18n="ct.info"></h2>
        <div class="info-card">
          <div class="info-item"><i><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2Z"/></svg></i><div><small data-i18n="i.hotline"></small><b class="ltr" data-phone></b></div></div>
          <div class="info-item emergency"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/><circle cx="12" cy="12" r="10"/></svg></i><div><small data-i18n="i.emergency"></small><b class="ltr" id="emergency"></b></div></div>
          <div class="info-item"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="10" r="2.6"/></svg></i><div><small data-i18n="i.address"></small><b data-i18n="i.address.v"></b></div></div>
          <div class="info-item"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg></i><div><small data-i18n="i.email"></small><b class="ltr">care@alshifa-hospital.example</b></div></div>
          <div class="info-item"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></i><div><small data-i18n="i.hours"></small><b data-i18n="i.hours.v"></b></div></div>
          <a class="map-card" href="https://www.google.com/maps" target="_blank" rel="noopener"><img src="assets/img/ab-building.jpg" alt=""><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="10" r="2.6"/></svg><span data-i18n="ct.map" style="position:static;padding:0;box-shadow:none;background:none"></span></span></a>
        </div>
      </aside>

      <div>
        <h2 class="block-title" style="margin-bottom:22px" data-i18n="ct.form"></h2>
        <form class="contact-form" id="contact-form" novalidate>
          <div class="two">
            <label class="field" id="f-name"><span data-i18n="f.name"></span><input class="input" id="cname" autocomplete="name" data-i18n-ph="f.name.ph"><small class="err" id="e-name"></small></label>
            <label class="field" id="f-phone"><span data-i18n="f.phone"></span><input class="input" id="cphone" inputmode="tel" autocomplete="tel" data-i18n-ph="f.phone.ph"><small class="err" id="e-phone"></small></label>
          </div>
          <label class="field"><span data-i18n="f.subject"></span>
            <div class="select-wrap"><select class="select" id="csubject"></select><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></div>
          </label>
          <label class="field" id="f-msg"><span data-i18n="f.msg"></span><textarea class="input" id="cmsg" data-i18n-ph="f.msg.ph"></textarea><small class="err" id="e-msg"></small></label>
          <button class="btn btn-cta" type="submit" data-i18n="f.send"></button>
          <p class="form-note" id="sent" hidden data-i18n="f.sent"></p>
        </form>
      </div>
    </div>
  </section>

<footer id="site-footer"></footer>
<script>
(function () {
  const EMERGENCY = { EG: "123", SA: "997", AE: "998", KW: "112", JO: "911" };
  document.addEventListener("shifa:apply", () => {
    const S = window.SHIFA, t = S.t;
    document.getElementById("emergency").textContent = EMERGENCY[S.state.country] + "  ·  " + S.COUNTRIES[S.state.country].phone;
    const sel = document.getElementById("csubject"), cur = sel.value || "book";
    sel.innerHTML = ["book", "results", "billing", "other"].map(k => `<option value="${k}" ${k === cur ? "selected" : ""}>${t("sub." + k)}</option>`).join("");
  });
  const setErr = (k, m) => { document.getElementById("e-" + k).textContent = m || ""; document.getElementById("f-" + k).classList.toggle("invalid", !!m); };
  document.getElementById("contact-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const t = window.SHIFA.t;
    const errs = {
      name: document.getElementById("cname").value.trim().length >= 3 ? "" : t("e.name"),
      phone: /^\d{8,12}$/.test(document.getElementById("cphone").value.replace(/[\s-]/g, "")) ? "" : t("e.phone"),
      msg: document.getElementById("cmsg").value.trim().length >= 10 ? "" : t("e.msg")
    };
    Object.entries(errs).forEach(([k, v]) => setErr(k, v));
    const ok = !Object.values(errs).some(Boolean);
    document.getElementById("sent").hidden = !ok;
    if (ok) e.target.reset();
  });
})();
</script>
