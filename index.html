<script>
/* ---------- Page data ---------- */
(function () {
  const { IC, SPECS, DOCTORS } = window.SHIFA_DATA;
  const CATS = [
    ["all", { ar: "الكل", en: "All" }], ["heart", SPECS.heart], ["dental", SPECS.dental],
    ["neuro", SPECS.neuro], ["internal", SPECS.internal], ["elderly", { ar: "كبار السن", en: "Senior care" }]
  ];
  const PACKAGES = [
    { cat: "heart", img: "pk-heart", price: 45, ar: ["فحص القلب الشامل", "رسم قلب وإيكو ومجهود مع كشف استشاري وتقرير مفصل."], en: ["Complete heart check-up", "ECG, echo and stress test with a consultant visit and full report."] },
    { cat: "heart", img: "pk-pressure", price: 10, ar: ["متابعة ضغط الدم", "قياسات دورية وضبط العلاج مع نظام غذائي مناسب لحالتك."], en: ["Blood pressure follow-up", "Regular readings and medication adjustment with a tailored diet plan."] },
    { cat: "dental", img: "pk-braces", price: 300, ar: ["تقويم الأسنان الشفاف", "تقويم غير ظاهر بخطة علاج رقمية ومتابعة شهرية."], en: ["Clear teeth aligners", "Invisible aligners with a digital treatment plan and monthly check-ins."] },
    { cat: "dental", img: "pk-dental", price: 20, ar: ["تنظيف وتلميع الأسنان", "إزالة الجير والتصبغات مع فحص شامل للفم واللثة."], en: ["Teeth cleaning & polish", "Tartar and stain removal with a full mouth and gum exam."] },
    { cat: "neuro", img: "pk-neuro", price: 35, ar: ["فحص المخ والأعصاب", "تقييم الصداع والدوخة والتنميل مع رسم أعصاب عند الحاجة."], en: ["Neurology assessment", "Evaluation of headaches, dizziness and numbness, with nerve studies if needed."] },
    { cat: "internal", img: "pk-vaccine", price: 8, ar: ["التطعيمات الموسمية", "تطعيم الإنفلونزا والتطعيمات الأساسية للكبار في دقائق."], en: ["Seasonal vaccinations", "Flu shots and essential adult vaccines in minutes."] },
    { cat: "internal", img: "pk-checkup", price: 30, ar: ["الفحص الطبي السنوي", "كشف باطنة وتحاليل دم شاملة وصورة قلب في زيارة واحدة."], en: ["Annual medical check-up", "Internal medicine visit, full blood tests and ECG in one visit."] },
    { cat: "elderly", img: "pk-elderly", price: 25, ar: ["رعاية كبار السن", "متابعة دورية للأمراض المزمنة والأدوية مع زيارة منزلية شهرية."], en: ["Senior care plan", "Regular chronic-condition and medication follow-up with a monthly home visit."] }
  ];
  const FAQ_N = 7;
  let activeCat = "all";

  function render() {
    const S = window.SHIFA, L = S.state.lang, t = S.t;
    // specialty select
    document.getElementById("spec-select").innerHTML =
      `<option value="">${t("hero.spec")}</option>` + Object.entries(SPECS).map(([k, v]) => `<option value="${k}">${v[L]}</option>`).join("");
    // doctors
    document.getElementById("doc-track").innerHTML = DOCTORS.slice(0, 6).map(d => window.SHIFA_DATA.doctorCard(d)).join("");
    // packages
    document.getElementById("pk-pills").innerHTML = CATS.map(([k, v]) =>
      `<button role="tab" class="${k === activeCat ? "on" : ""}" aria-selected="${k === activeCat}" data-cat="${k}">${v[L]}</button>`).join("");
    document.getElementById("pk-grid").innerHTML = PACKAGES.map(p => `
      <article class="pk-card" ${activeCat !== "all" && p.cat !== activeCat ? "hidden" : ""}>
        <img src="assets/img/${p.img}.jpg" alt="">
        <div class="pk-body">
          <h3>${p[L][0]}</h3><p>${p[L][1]}</p>
          <div class="pk-foot"><span class="from">${t("pk.from")} <b>${S.formatPrice(p.price)}</b></span><a class="btn btn-cta" href="booking.html">${t("pk.book")}</a></div>
        </div>
      </article>`).join("");
    // faq
    document.getElementById("faq-list").innerHTML = Array.from({ length: FAQ_N }, (_, i) => `
      <details class="faq-item" ${i === 0 ? "open" : ""}><summary>${t("q" + (i + 1))}${IC.chev}</summary><p>${t("a" + (i + 1))}</p></details>`).join("");
  }

  document.addEventListener("shifa:apply", render);
  document.addEventListener("click", (e) => {
    const pill = e.target.closest("[data-cat]");
    if (pill) { activeCat = pill.dataset.cat; render(); return; }
    const arrow = e.target.closest("[data-scroll]");
    if (arrow) {
      const track = document.getElementById("doc-track");
      const dir = (document.documentElement.dir === "rtl" ? -1 : 1) * parseInt(arrow.dataset.scroll, 10);
      track.scrollBy({ left: dir * track.clientWidth, behavior: "smooth" });
    }
  });
})();
</script>
