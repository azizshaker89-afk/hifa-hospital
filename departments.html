<body data-page="departments">

    </div>
  </section>

<footer id="site-footer"></footer>

<script src="assets/js/data.js"></script>
<script>
(function () {
  const { SPECS, SPEC_INFO, SPEC_ICONS } = window.SHIFA_DATA;
  const users = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 13.8c2.1.8 3.5 3 3.5 6.2"/></svg>';
  const clock = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  document.addEventListener("shifa:apply", () => {
    const S = window.SHIFA, L = S.state.lang, t = S.t;
    document.getElementById("spec-grid").innerHTML = Object.entries(SPECS).map(([k, v]) => `
      <article class="spec-card">
        <div class="spec-icon">${SPEC_ICONS[k]}</div>
        <h3>${v[L]}</h3>
        <p>${SPEC_INFO[k][L]}</p>
        <div class="spec-meta">${users}<span><b>${SPEC_INFO[k].team}</b> ${t("dp.team")}</span></div>
        <div class="spec-actions">
          <a class="btn btn-outline" href="doctors.html?spec=${k}">${t("dp.doctors")}</a>
          <a class="btn btn-cta" href="booking.html?spec=${k}">${t("dp.book")}</a>
        </div>
      </article>`).join("");
    document.querySelectorAll("[data-hours]").forEach(el => { el.innerHTML = clock + t(el.dataset.hours === "24" ? "h.24" : "h.day"); });
  });
})();
</script>
<script src="assets/js/main.js"></script>
